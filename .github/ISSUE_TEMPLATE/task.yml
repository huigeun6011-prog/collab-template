name: 업무 (Task)
description: 구현, 문서, 조사 등 일반 업무
title: "<type>: <요약>"
labels: ["type:task"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 왜 필요한가. 배경과 기대 효과.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 체크리스트로 작성. PR이 모두 만족해야 Merge된다.
      placeholder: "- [ ] 조건 1\n- [ ] 조건 2"
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: 의존성
      description: "`Depends on #N` 형식. 없으면 비워 둔다."
  - type: input
    id: agent
    attributes:
      label: 담당 식별자
      description: "예: AI-DEV-01 또는 HUMAN-홍길동. 미정이면 비워 둔다."
