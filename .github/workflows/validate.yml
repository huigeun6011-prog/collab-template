name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # 서버를 바꾸는 명령(init_project 등)은 실행하지 않는다.
      - run: python -m unittest discover -s tests
